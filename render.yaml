databases:
  - name: product-catalog-db
    databaseName: product_catalog
    plan: free

services:
  - type: web
    name: product-catalog-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: product-catalog-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "https://product-catalog-frontend.onrender.com"
      - key: UPLOAD_DIR
        value: ./storage/uploads
      - key: REPORT_DIR
        value: ./storage/reports
      - key: NODE_VERSION
        value: 20.18.0

  - type: static
    name: product-catalog-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
